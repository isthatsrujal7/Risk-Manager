version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./riskguard.db
      - LLM_PROVIDER=openai
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - ./:/workspace
    # The image CMD seeds the held-out demo stream on first boot when the DB
    # is empty, then serves the API on :8000. The bind mount keeps model
    # artifacts and code in sync with the host.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend